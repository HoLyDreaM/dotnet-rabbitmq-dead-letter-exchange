services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-dlx-demo
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    # guest yalnızca localhost için uygundur; production'da ayrı kullanıcı kullanın.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
