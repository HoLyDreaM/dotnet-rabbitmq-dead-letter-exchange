name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true

      - name: Restore
        run: dotnet restore dotnet-rabbitmq-dead-letter-exchange.sln

      - name: Build
        run: dotnet build dotnet-rabbitmq-dead-letter-exchange.sln -c Release --no-restore

      - name: Test
        run: dotnet test dotnet-rabbitmq-dead-letter-exchange.sln -c Release --no-build --verbosity normal
